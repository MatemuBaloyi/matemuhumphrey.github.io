<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="aboutproject.css">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <title>Project Information</title>
</head>

<body>
  <a href="index.html#portfolio" class="back-link"><i class='bx bx-left-arrow-alt'></i> Back to portfolio</a>
  <div id="project-container"></div>

<script src="projects-data.js"></script>
<script>
    // Get ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get("id");

    const container = document.getElementById("project-container");
    const project = projectsData[projectId];

    if (!project) {
        container.innerHTML = "<h2>Project not found.</h2>";
    } else {
        // Generate HTML
        const images = project.images || [project.image];
        const imagesHTML = images.map((img) => 
            `<img src="${img}" class="project-banner">`
        ).join('');
        
        container.innerHTML = `
            <h1 class="ProjectTitle">${project.title}</h1>
            <div class="project-images">
               ${imagesHTML}
            </div>

            <h2 class="ProjectDescription">Description</h2>
            ${project.description.map(p => `<p class="DescrptionContent">${p}</p>`).join("")}

            <h2 class="Features">Key Features</h2>
            <ul>
                ${project.bulletPoints.map(b => `<li>${b}</li>`).join("")}
            </ul>

            <h2 class="Tech-Header">Technologies</h2>
            <div class="tech-tags">
                ${project.technologies.map(t => `<span class="tag">${t}</span>`).join("")}
            </div>

            <a href="${project.link}" class="btn" target="_blank" rel="noopener">View Live Project</a>
        `;
    }
</script>
</body>

</html>
